type BugCreateOperation implements Operation & Authored
@goModel(model: "github.com/git-bug/git-bug/entities/bug.CreateOperation") {
    """The identifier of the operation"""
    id: ID!
    """The author of this object."""
    author: Identity!
    """The datetime when this operation was issued."""
    date: Time! @goField(name: "Time")

    title: String!
    message: String!
    files: [Hash!]!
    """Issue vs pull-request."""
    kind: BugKind!
    """For PRs, the base branch. Empty for issues."""
    baseRef: String!
    """For PRs, the head branch. Empty for issues."""
    headRef: String!
    """For PRs, the initial head commit. Empty for issues."""
    headCommit: String!
    """For PRs, whether the PR was created in draft state."""
    draft: Boolean!
}

