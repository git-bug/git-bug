# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
---
version: 2

project_name: git-bug

before:
  hooks:
    # The webui is compiled into the binary with //go:embed (see
    # //webui:handler.go) and webui/dist is not tracked in git, so the frontend
    # must be built before any go build can succeed.
    - pnpm --dir webui install --frozen-lockfile
    - pnpm --dir webui run build
    - go mod download

builds:
  - id: git-bug
    main: .
    binary: git-bug
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    tags:
      # //webui:assets.go embeds webui/dist behind this tag; without it the
      # binary has no web UI. The before hooks build the frontend.
      - webui
    ldflags:
      # main.version is read by //:version.go. Everything else shown by
      # `git-bug version` (commit, dirty, go version, os, arch) comes from the
      # build metadata go stamps into the binary on its own.
      - -s -w -X main.version=v{{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos:
      - linux
      - darwin
      - windows
      - freebsd
      - openbsd
      - netbsd
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - "6"
      - "7"
    ignore:
      # 32-bit arm is only worth shipping for linux (raspberry pi and friends)
      - goos: darwin
        goarch: arm
      - goos: windows
        goarch: arm
      - goos: freebsd
        goarch: arm
      - goos: openbsd
        goarch: arm
      - goos: netbsd
        goarch: arm
      - goos: openbsd
        goarch: arm64
      - goos: netbsd
        goarch: arm64

archives:
  # The primary artifact: a versioned archive carrying the binary alongside the
  # man pages and shell completions generated by `go generate`.
  - id: archive
    ids:
      - git-bug
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}
    files:
      - README.md
      - LICENSE
      - INSTALLATION.md
      - src: doc/man/*.1
        dst: man
        strip_parent: true
      - src: misc/completion/*/git-bug
        dst: completion

  # Bare binaries, named exactly as the previous gox-based release named them,
  # so existing download URLs and downstream packaging keep working.
  - id: binary
    ids:
      - git-bug
    formats:
      - binary
    name_template: >-
      {{ .ProjectName }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github-native

release:
  draft: true
  prerelease: auto
