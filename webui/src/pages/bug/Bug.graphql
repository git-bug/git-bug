#import "../components/fragments.graphql"

fragment Bug on Bug {
  id
  humanId
  kind
  status
  title
  labels {
    ...Label
  }
  createdAt
  originUrl
  baseRef
  headRef
  headCommit
  mergeCommit
  reviews {
    id
    state
    body
    commitHash
    createdAt
    ...authored
    comments {
      id
      body
      path
      startLine
      endLine
      commitHash
      replyTo
      createdAt
      ...authored
    }
  }
  ...authored
}
