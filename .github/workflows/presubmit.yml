# //.github/workflows:presubmit.yml
#
# This file exists to define the steps executed for a push to each tree matching
# the pattern `refs/heads/*`, excluding the default ref, when they are used as
# the head for a pull request against the default tree. For configuring the
# steps that occur after a push to the trunk branch, see
# `//.github/workflows:trunk.yml`.
---
name: presubmit

on:
  merge_group:
    types:
      - checks_requested
  pull_request:
    branches:
      - trunk

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  build-and-test:
    uses: ./.github/workflows/build-and-test.yml
    secrets:
      github-test-token: ${{ secrets.TEST_TOKEN_GITHUB }}
      github-token-private: ${{ secrets._GITHUB_TOKEN_PRIVATE }}
      github-token-public: ${{ secrets._GITHUB_TOKEN_PUBLIC }}
      gitlab-api-token: ${{ secrets.GITLAB_API_TOKEN }}
      gitlab-project-id: ${{ secrets.GITLAB_PROJECT_ID }}
