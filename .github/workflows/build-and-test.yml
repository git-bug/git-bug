---
name: build-and-test

on:
  merge_group:
    types:
      - checks_requested
  pull_request:
    branches:
      - trunk
  push:
    branches:
      - trunk

concurrency:
  # github.workflow is part of the group because concurrency groups are
  # repo-wide: without it a push to trunk would share a group with
  # //.github/workflows:trunk.yml and the two would cancel each other.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  with-go:
    strategy:
      matrix:
        # Keep the newest Go version and ubuntu-latest first: the first job of
        # the matrix (strategy.job-index == 0) runs the e2e bridge tests.
        go-version: [1.27.x, 1.26.x]
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: webui/package.json

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: webui/pnpm-lock.yaml

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}

      - name: Install webui dependencies
        run: pnpm install
        working-directory: webui

      - name: Build
        run: make

      - name: Test
        run: make test
        env:
          # The bridge e2e tests talk to the real GitHub and GitLab APIs, and
          # create and delete repositories on the test accounts. Only run them
          # on the first matrix job, so that concurrent jobs don't trip rate
          # limits or step on each other. Other jobs skip them.
          GITHUB_USER: ${{ strategy.job-index == 0 && vars.TEST_USER_GITHUB || '' }}
          GITHUB_TOKEN: ${{ strategy.job-index == 0 && secrets._GITHUB_TOKEN_ADMIN || '' }}
          GITHUB_TOKEN_PRIVATE: ${{ strategy.job-index == 0 && secrets._GITHUB_TOKEN_PRIVATE || '' }}
          GITHUB_TOKEN_PUBLIC: ${{ strategy.job-index == 0 && secrets._GITHUB_TOKEN_PUBLIC || '' }}
          GITLAB_API_TOKEN: ${{ strategy.job-index == 0 && secrets.GITLAB_API_TOKEN || '' }}
          GITLAB_PROJECT_ID: ${{ strategy.job-index == 0 && secrets.GITLAB_PROJECT_ID || '' }}

  with-node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webui
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: webui/package.json

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: webui/pnpm-lock.yaml

      - name: Install
        run: pnpm install

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('webui/pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - name: Install Playwright system deps
        run: pnpm exec playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      - name: Check
        run: pnpm run check

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: webui/package.json

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: webui/pnpm-lock.yaml

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.x

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      # the man pages in //doc:man and the shell completions in
      # //misc:completion are generated from the cobra command tree and
      # committed, so the release archives can ship them without a generate
      # step. regenerate them here and fail if the result differs from what is
      # committed. the webui build is needed first because //doc:generate.go
      # pulls in //commands, which pulls in //webui and its //go:embed.
      - name: Check generated files are up to date
        run: |
          make build-webui
          go generate
          git diff --exit-code -- doc/man doc/md misc/completion
